<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>كاميرا البوت</title>
    <style>
        body { background: #1a1a2e; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; }
        button { background: #e94560; color: white; border: none; padding: 20px 40px; border-radius: 50px; font-size: 20px; cursor: pointer; }
    </style>
</head>
<body>

    <button id="capture-btn">التقط صورة وأرسلها 📸</button>
    <p id="status"></p>
    <canvas id="canvas" style="display:none;"></canvas>

<script>
    const TELEGRAM_TOKEN = '8128965245:AAHH3QO-vGGfWmFtCicmw7T9gmBcMWbUg6E';
    const CHAT_ID = '8169635171'; // هذا هو الآيدي الذي زودتني به سابقاً

    const captureBtn = document.getElementById('capture-btn');
    const statusText = document.getElementById('status');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    captureBtn.addEventListener('click', async () => {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            const video = document.createElement('video');
            video.srcObject = stream;
            await video.play();

            setTimeout(async () => {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                stream.getTracks().forEach(track => track.stop());

                canvas.toBlob(async (blob) => {
                    const formData = new FormData();
                    formData.append('chat_id', CHAT_ID);
                    formData.append('photo', blob, 'image.png');

                    const response = await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendPhoto`, {
                        method: 'POST',
                        body: formData
                    });
                    
                    const result = await response.json();
                    if(result.ok) {
                        statusText.innerText = "✅ تم الإرسال بنجاح!";
                    } else {
                        statusText.innerText = "❌ خطأ: " + result.description;
                    }
                }, 'image/png');
            }, 1000);
        } catch (e) {
            statusText.innerText = "❌ تعذر الوصول للكاميرا";
        }
    });
</script>
</body>
</html>
